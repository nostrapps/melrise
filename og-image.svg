<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Tower blocks -->
  <rect x="450" y="480" width="300" height="40" fill="#FF6B6B" rx="4"/>
  <rect x="460" y="435" width="280" height="40" fill="#4ECDC4" rx="4"/>
  <rect x="470" y="390" width="260" height="40" fill="#45B7D1" rx="4"/>
  <rect x="480" y="345" width="240" height="40" fill="#96CEB4" rx="4"/>
  <rect x="490" y="300" width="220" height="40" fill="#FFEAA7" rx="4"/>
  <rect x="500" y="255" width="200" height="40" fill="#DDA0DD" rx="4"/>
  <rect x="510" y="210" width="180" height="40" fill="#98D8C8" rx="4"/>

  <!-- Swinging block with motion lines -->
  <line x1="600" y1="100" x2="600" y2="150" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="520" y="150" width="160" height="40" fill="#F7DC6F" rx="4" opacity="0.5"/>
  <rect x="580" y="150" width="160" height="40" fill="#F7DC6F" rx="4"/>

  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">SKYRISE</text>

  <!-- Subtitle -->
  <text x="600" y="580" font-family="system-ui, sans-serif" font-size="24" fill="#888888" text-anchor="middle">Stack blocks. Build higher. Beat the world.</text>

  <!-- Trophy icon -->
  <text x="100" y="100" font-size="60">🏆</text>

  <!-- Nostr badge -->
  <text x="1000" y="580" font-family="system-ui, sans-serif" font-size="18" fill="#667eea" text-anchor="middle">Powered by Nostr</text>
</svg>
