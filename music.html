<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melrise - Music Lab</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stop-btn {
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: #e74c3c;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .stop-btn:hover { transform: translateY(-2px); }
    .stop-btn:active { transform: translateY(0); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.3s, background 0.3s;
    }

    .song-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .song-card.playing {
      border-color: #4ECDC4;
      background: rgba(78, 205, 196, 0.1);
      box-shadow: 0 0 20px rgba(78, 205, 196, 0.2);
    }

    .song-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 0.25rem;
    }

    .song-key {
      font-size: 0.85rem;
      color: #4ECDC4;
      margin-bottom: 0.5rem;
    }

    .song-desc {
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.4;
      margin-bottom: 0.75rem;
    }

    .song-instruments {
      font-size: 0.75rem;
      color: #7a7aaa;
      margin-bottom: 0.5rem;
      font-style: italic;
    }

    .song-meta {
      display: flex;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #666;
      flex-wrap: wrap;
    }

    .song-meta span {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .now-playing {
      text-align: center;
      font-size: 0.9rem;
      color: #4ECDC4;
      margin-bottom: 1rem;
      min-height: 1.5rem;
    }

    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 3px;
      height: 40px;
      margin-bottom: 1rem;
    }

    .viz-bar {
      width: 4px;
      background: #4ECDC4;
      border-radius: 2px;
      transition: height 0.1s;
    }

    /* Tracker section */
    .section-divider {
      max-width: 1200px;
      margin: 3rem auto 1rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 2rem;
    }

    .section-divider h2 {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .section-divider .subtitle {
      margin-bottom: 1.5rem;
    }

    .tracker-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.3s, background 0.3s;
    }

    .tracker-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.08);
    }

    .tracker-card.playing {
      border-color: #F7DC6F;
      background: rgba(247, 220, 111, 0.1);
      box-shadow: 0 0 20px rgba(247, 220, 111, 0.2);
    }

    .tracker-card .song-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 0.25rem; }
    .tracker-card .song-key { font-size: 0.85rem; color: #F7DC6F; margin-bottom: 0.5rem; }
    .tracker-card .song-desc { font-size: 0.85rem; color: #aaa; line-height: 1.4; margin-bottom: 0.75rem; }
    .tracker-card .song-meta { display: flex; gap: 0.5rem; font-size: 0.75rem; color: #666; flex-wrap: wrap; }
    .tracker-card .song-meta span { background: rgba(255,255,255,0.1); padding: 0.25rem 0.5rem; border-radius: 4px; }

    .tracker-card .license-tag {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .license-pd { background: rgba(78, 205, 196, 0.3); color: #4ECDC4; }
    .license-ref { background: rgba(231, 76, 60, 0.3); color: #e74c3c; }

    .custom-url-section {
      max-width: 1200px;
      margin: 2rem auto;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .custom-url-section input {
      flex: 1;
      min-width: 300px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .custom-url-section input:focus {
      border-color: #F7DC6F;
    }

    .custom-url-section button {
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      background: #F7DC6F;
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tracker-status {
      max-width: 1200px;
      margin: 0 auto 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: #F7DC6F;
      min-height: 1.3rem;
    }

    .tracker-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .tracker-controls button {
      padding: 0.5rem 1.5rem;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
    }

    .btn-stop-tracker { background: #e74c3c; }
    .btn-stop-tracker:hover { opacity: 0.85; }
  </style>
</head>

  <h1>Melrise Music Lab</h1>
  <p class="subtitle">Click a song to play. Each has unique instruments, waveforms & character.</p>

  <div id="now-playing" class="now-playing"></div>

  <div class="controls">
    <button class="stop-btn" onclick="stopMusic()">Stop</button>
  </div>

  <div class="grid" id="grid"></div>

  <!-- ========== TRACKER TUNES SECTION ========== -->
  <div class="section-divider">
    <h2>Classic Tracker Tunes</h2>
    <p class="subtitle">Real MOD/XM files played via libopenmpt. Hear how the originals actually sounded.</p>
  </div>

  <div id="tracker-status" class="tracker-status"></div>

  <div class="tracker-controls">
    <button class="btn-stop-tracker" onclick="window.stopTracker?.()">Stop Tracker</button>
  </div>

  <div class="grid" id="tracker-grid"></div>

  <div class="custom-url-section">
    <input type="text" id="custom-url" placeholder="Paste a modarchive.org URL or direct .mod/.xm link..." />
    <button onclick="window.playCustomURL?.()">Play URL</button>
  </div>

    // ========== AUDIO ENGINE ==========

    let audioCtx = null;
    let musicPlaying = false;
    let musicNodes = null;
    let currentSongIndex = -1;
    let vizBars = [];

    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    // Pulse wave via custom periodic wave (SID-style)
    function createPulseOsc(ctx, freq, pw) {
      const osc = ctx.createOscillator();
      const real = new Float32Array(32);
      const imag = new Float32Array(32);
      real[0] = 0; imag[0] = 0;
      for (let i = 1; i < 32; i++) {
        imag[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * pw);
      }
      osc.setPeriodicWave(ctx.createPeriodicWave(real, imag));
      osc.frequency.value = freq;
      return osc;
    }

    // Create oscillator with configurable waveform
    function createOsc(ctx, waveform, freq, pulseWidth) {
      if (waveform === 'pulse') {
        return createPulseOsc(ctx, freq, pulseWidth || 0.25);
      }
      const osc = ctx.createOscillator();
      osc.type = waveform;
      osc.frequency.value = freq;
      return osc;
    }

    // Shared noise buffer (created once, reused)
    let noiseBuffer = null;
    function getNoiseBuffer(ctx) {
      if (!noiseBuffer || noiseBuffer.sampleRate !== ctx.sampleRate) {
        const size = ctx.sampleRate * 0.2;
        noiseBuffer = ctx.createBuffer(1, size, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
      }
      return noiseBuffer;
    }

    function playSong(index) {
      stopMusic();
      if (window.stopTracker) window.stopTracker();

      const song = SONGS[index];
      currentSongIndex = index;
      musicPlaying = true;

      document.querySelectorAll('.song-card').forEach((c, i) => {
        c.classList.toggle('playing', i === index);
      });
      document.getElementById('now-playing').textContent = `Now playing: ${song.title}`;

      try {
        const ctx = getAudioContext();
        const inst = mergeInst(song.instruments);

        // Master chain
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -20;
        compressor.knee.value = 10;
        compressor.ratio.value = 4;
        compressor.connect(ctx.destination);

        const analyser = ctx.createAnalyser();
        analyser.fftSize = 64;
        analyser.connect(compressor);

        const masterGain = ctx.createGain();
        masterGain.gain.value = 0.4;
        masterGain.connect(analyser);

        // Channel gains
        const bassGain = ctx.createGain();
        bassGain.gain.value = inst.bass.gain;
        bassGain.connect(masterGain);

        const arpGain = ctx.createGain();
        arpGain.gain.value = inst.arp.gain;
        arpGain.connect(masterGain);

        const leadGain = ctx.createGain();
        leadGain.gain.value = inst.lead.gain;
        leadGain.connect(masterGain);

        const drumsGain = ctx.createGain();
        drumsGain.gain.value = inst.drums.gain;
        drumsGain.connect(masterGain);

        // Arp filter
        const arpFilter = ctx.createBiquadFilter();
        arpFilter.type = 'lowpass';
        arpFilter.frequency.value = inst.arp.filterFreq;
        arpFilter.Q.value = inst.arp.filterQ;
        arpFilter.connect(arpGain);

        const { chords, melody, bpm, arpSpeed } = song;
        const beatMs = 60000 / bpm;
        const beatSec = beatMs / 1000;
        const halfBeat = beatSec / 2;

        let chordIndex = 0, beatInChord = 0, melodyIndex = 0, arpNoteIndex = 0;

        // ---- BASS ----
        function playBass(freq, duration, offset) {
          const t = ctx.currentTime + (offset || 0);
          const osc = createOsc(ctx, inst.bass.waveform, freq, 0.3);
          const env = ctx.createGain();
          osc.connect(env);
          env.connect(bassGain);
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(0.8, t + inst.bass.attack);
          env.gain.setValueAtTime(inst.bass.sustain, t + inst.bass.attack + 0.01);
          env.gain.exponentialRampToValueAtTime(0.01, t + duration * inst.bass.release);
          osc.start(t);
          osc.stop(t + duration);
        }

        // ---- LEAD ----
        function playLead(freq, duration, offset) {
          if (freq === 0) return;
          const t = ctx.currentTime + (offset || 0);
          const lc = inst.lead;

          // Primary oscillator
          const osc1 = createOsc(ctx, lc.waveform, freq, lc.pulseWidth + (Math.random() * 0.04 - 0.02));
          const env = ctx.createGain();

          // Vibrato
          if (lc.vibRate > 0) {
            const vib = ctx.createOscillator();
            const vibG = ctx.createGain();
            vib.frequency.value = lc.vibRate;
            vibG.gain.value = freq * lc.vibDepth;
            vib.connect(vibG);
            vibG.connect(osc1.frequency);
            vib.start(t);
            vib.stop(t + duration);
          }

          // Optional filter
          let lastNode = osc1;
          if (lc.filterFreq > 0) {
            const flt = ctx.createBiquadFilter();
            flt.type = 'lowpass';
            flt.frequency.value = lc.filterFreq;
            flt.Q.value = 1;
            osc1.connect(flt);
            lastNode = flt;
          }
          lastNode.connect(env);
          env.connect(leadGain);

          // Envelope
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(0.7, t + lc.attack);
          env.gain.setValueAtTime(lc.sustain, t + lc.attack + 0.01);
          env.gain.exponentialRampToValueAtTime(0.01, t + duration * lc.release);
          osc1.start(t);
          osc1.stop(t + duration);

          // Detuned second oscillator for thickness
          if (lc.detune > 0) {
            const osc2 = createOsc(ctx, lc.waveform, freq, lc.pulseWidth);
            osc2.detune.value = lc.detune;
            const env2 = ctx.createGain();
            let lastNode2 = osc2;
            if (lc.filterFreq > 0) {
              const flt2 = ctx.createBiquadFilter();
              flt2.type = 'lowpass';
              flt2.frequency.value = lc.filterFreq;
              osc2.connect(flt2);
              lastNode2 = flt2;
            }
            lastNode2.connect(env2);
            env2.connect(leadGain);
            env2.gain.setValueAtTime(0, t);
            env2.gain.linearRampToValueAtTime(0.45, t + lc.attack);
            env2.gain.setValueAtTime(lc.sustain * 0.65, t + lc.attack + 0.01);
            env2.gain.exponentialRampToValueAtTime(0.01, t + duration * lc.release);
            osc2.start(t);
            osc2.stop(t + duration);
          }
        }

        // ---- ARP ----
        const arpIntervalId = setInterval(() => {
          if (!musicPlaying) { clearInterval(arpIntervalId); return; }
          const chord = chords[chordIndex];
          const freq = chord.arp[arpNoteIndex % chord.arp.length];
          arpNoteIndex++;
          const osc = createOsc(ctx, inst.arp.waveform, freq, 0.25);
          const env = ctx.createGain();
          osc.connect(env);
          env.connect(arpFilter);
          const now = ctx.currentTime;
          const dur = arpSpeed / 1000;
          env.gain.setValueAtTime(0, now);
          env.gain.linearRampToValueAtTime(0.5, now + dur * inst.arp.attack);
          env.gain.setValueAtTime(0.4, now + dur * 0.3);
          env.gain.exponentialRampToValueAtTime(0.01, now + dur * inst.arp.release);
          osc.start(now);
          osc.stop(now + dur);
        }, arpSpeed);

        // ---- DRUMS ----
        function playKick(time, g) {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, time);
          osc.frequency.exponentialRampToValueAtTime(40, time + 0.12);
          env.gain.setValueAtTime(g, time);
          env.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
          osc.connect(env);
          env.connect(drumsGain);
          osc.start(time);
          osc.stop(time + 0.2);
        }

        function playSnare(time, g) {
          const noise = ctx.createBufferSource();
          noise.buffer = getNoiseBuffer(ctx);
          const flt = ctx.createBiquadFilter();
          flt.type = 'bandpass';
          flt.frequency.value = 1200;
          flt.Q.value = 0.6;
          const env = ctx.createGain();
          env.gain.setValueAtTime(g * 0.8, time);
          env.gain.exponentialRampToValueAtTime(0.01, time + 0.12);
          noise.connect(flt);
          flt.connect(env);
          env.connect(drumsGain);
          noise.start(time);
          noise.stop(time + 0.15);

          // Tone body
          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.value = 200;
          const env2 = ctx.createGain();
          env2.gain.setValueAtTime(g * 0.4, time);
          env2.gain.exponentialRampToValueAtTime(0.01, time + 0.06);
          osc.connect(env2);
          env2.connect(drumsGain);
          osc.start(time);
          osc.stop(time + 0.08);
        }

        function playHihat(time, g) {
          const noise = ctx.createBufferSource();
          noise.buffer = getNoiseBuffer(ctx);
          const flt = ctx.createBiquadFilter();
          flt.type = 'highpass';
          flt.frequency.value = 8000;
          const env = ctx.createGain();
          env.gain.setValueAtTime(g * 0.35, time);
          env.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
          noise.connect(flt);
          flt.connect(env);
          env.connect(drumsGain);
          noise.start(time);
          noise.stop(time + 0.06);
        }

        function playDrumBeat(beat) {
          const time = ctx.currentTime;
          const g = inst.drums.gain;
          const dp = inst.drums.pattern;

          if (dp === 'basic') {
            if (beat === 0 || beat === 2) playKick(time, g);
            if (beat === 1 || beat === 3) playSnare(time, g * 0.7);
            playHihat(time, g * 0.5);
            playHihat(time + halfBeat, g * 0.3);
          } else if (dp === 'driving') {
            playKick(time, g);
            if (beat === 1 || beat === 3) playSnare(time, g * 0.6);
            playHihat(time, g * 0.45);
            playHihat(time + halfBeat, g * 0.35);
          } else if (dp === 'march') {
            if (beat === 0 || beat === 2) playKick(time, g);
            if (beat === 2) playSnare(time + 0.01, g * 0.5);
            if (beat === 3) playSnare(time, g * 0.8);
          }
        }

        // ---- MAIN BEAT SCHEDULER ----
        function scheduleBeat() {
          if (!musicPlaying) return;
          const chord = chords[chordIndex];
          const nextChord = chords[(chordIndex + 1) % chords.length];

          // === BASS ===
          const bp = inst.bass.pattern;
          if (bp === 'half') {
            if (beatInChord === 0 || beatInChord === 2)
              playBass(chord.bass, beatSec * 1.8);
          } else if (bp === 'quarter') {
            playBass(chord.bass, beatSec * 0.8);
          } else if (bp === 'eighth') {
            playBass(chord.bass, halfBeat * 0.7, 0);
            playBass(chord.bass, halfBeat * 0.7, halfBeat);
          } else if (bp === 'octave') {
            if (beatInChord % 2 === 0) playBass(chord.bass, beatSec * 0.7);
            else playBass(chord.bass * 2, beatSec * 0.7);
          } else if (bp === 'walking') {
            if (beatInChord === 0) playBass(chord.bass, beatSec * 0.75);
            else if (beatInChord === 1) playBass(chord.arp[0], beatSec * 0.75);
            else if (beatInChord === 2) playBass(chord.bass, beatSec * 0.75);
            else playBass(nextChord.bass * 0.9439, beatSec * 0.75); // chromatic approach
          } else if (bp === 'whole') {
            if (beatInChord === 0) playBass(chord.bass, beatSec * 3.5);
          }

          // === LEAD ===
          playLead(melody[melodyIndex], beatSec * 0.9);
          melodyIndex = (melodyIndex + 1) % melody.length;

          // === DRUMS ===
          if (inst.drums.enabled && inst.drums.pattern !== 'none') {
            playDrumBeat(beatInChord);
          }

          // Advance beat
          beatInChord++;
          if (beatInChord >= 4) {
            beatInChord = 0;
            chordIndex = (chordIndex + 1) % chords.length;
          }
        }

        scheduleBeat();
        const mainIntervalId = setInterval(() => {
          if (!musicPlaying) { clearInterval(mainIntervalId); clearInterval(arpIntervalId); return; }
          scheduleBeat();
        }, beatMs);

        musicNodes = { masterGain, mainIntervalId, arpIntervalId, analyser };
        startVisualizer(analyser);

      } catch (e) {
        console.error('Music error:', e);
      }
    }

    function stopMusic() {
      musicPlaying = false;
      currentSongIndex = -1;
      if (musicNodes) {
        clearInterval(musicNodes.mainIntervalId);
        clearInterval(musicNodes.arpIntervalId);
        try {
          musicNodes.masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        } catch (e) {}
        musicNodes = null;
      }
      document.querySelectorAll('.song-card').forEach(c => c.classList.remove('playing'));
      document.getElementById('now-playing').textContent = '';
      vizBars.forEach(bar => bar.style.height = '2px');
    }

    // ========== VISUALIZER ==========

    function initVisualizer() {
      const container = document.getElementById('visualizer');
      for (let i = 0; i < 24; i++) {
        const bar = document.createElement('div');
        bar.className = 'viz-bar';
        bar.style.height = '2px';
        container.appendChild(bar);
        vizBars.push(bar);
      }
    }

    function startVisualizer(analyser) {
      const data = new Uint8Array(analyser.frequencyBinCount);
      function draw() {
        if (!musicPlaying) return;
        analyser.getByteFrequencyData(data);
        for (let i = 0; i < vizBars.length; i++) {
          const idx = Math.floor(i * data.length / vizBars.length);
          const h = Math.max(2, (data[idx] / 255) * 40);
          vizBars[i].style.height = h + 'px';
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    // ========== UI ==========

    function describeInstruments(inst) {
      const i = mergeInst(inst);
      const parts = [];
      parts.push(i.lead.waveform + ' lead');
      if (i.lead.detune > 0) parts[0] = 'detuned ' + parts[0];
      parts.push(i.bass.waveform + ' ' + i.bass.pattern + ' bass');
      parts.push(i.arp.waveform + ' arp');
      if (i.drums.enabled) parts.push(i.drums.pattern + ' drums');
      return parts.join(' · ');
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      SONGS.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.onclick = () => {
          if (currentSongIndex === i) stopMusic();
          else playSong(i);
        };
        card.innerHTML = `
          <div class="song-title">${song.title}</div>
          <div class="song-key">${song.key} - ${song.style}</div>
          <div class="song-desc">${song.desc}</div>
          <div class="song-instruments">${describeInstruments(song.instruments)}</div>
          <div class="song-meta">
            <span>${song.bpm} BPM</span>
            <span>Arp: ${song.arpSpeed}ms</span>
            <span>${song.chords.length} chords</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    initVisualizer();
    renderGrid();
  </script>

    let modPlayer = null;
    let trackerPlaying = false;
    let currentTrackerIndex = -1;

    function playTrackerTune(index) {
      const tune = TRACKER_TUNES[index];
      playTrackerFile(tune.file, tune.title, index);
    }

    function playTrackerFile(file, title, cardIndex) {
      // Stop everything
      stopTrackerInternal();
      if (typeof stopMusic === 'function') stopMusic();

      const statusEl = document.getElementById('tracker-status');
      statusEl.textContent = `Loading ${title || file}...`;

      // Update card highlighting
      document.querySelectorAll('.tracker-card').forEach((c, i) => {
        c.classList.toggle('playing', i === cardIndex);
      });

      try {
        modPlayer = new ScripTracker();

        modPlayer.on(ScripTracker.Events.playerReady, function() {
          modPlayer.setMasterVolume(0.4);
          modPlayer.play();
          trackerPlaying = true;
          currentTrackerIndex = cardIndex ?? -1;
          statusEl.textContent = `Now playing: ${title || file}`;
        });

        modPlayer.on(ScripTracker.Events.songEnded, function() {
          // Loop
          modPlayer.play();
        });

        modPlayer.loadModule(file);

      } catch (e) {
        console.error('Tracker error:', e);
        statusEl.textContent = `Error: ${e.message}`;
        document.querySelectorAll('.tracker-card').forEach(c => c.classList.remove('playing'));
      }
    }

    function stopTrackerInternal() {
      if (modPlayer) {
        try { modPlayer.stop(); } catch(e) {}
        modPlayer = null;
      }
      trackerPlaying = false;
      currentTrackerIndex = -1;
      document.querySelectorAll('.tracker-card').forEach(c => c.classList.remove('playing'));
      document.getElementById('tracker-status').textContent = '';
    }

    // Expose to global scope
    window.stopTracker = stopTrackerInternal;

    window.playCustomURL = function() {
      const input = document.getElementById('custom-url');
      let url = input.value.trim();
      if (!url) return;
      playTrackerFile(url, 'Custom track', -1);
