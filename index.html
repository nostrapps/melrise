<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100vh;
      max-width: 500px;
      position: relative;
    }

    canvas {
      display: block;
      background: transparent;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .title {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }

    .health-display {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      z-index: 5;
    }

    .perfect-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700;
      animation: perfectPop 0.6s ease-out forwards;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes perfectPop {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(1);
      }
    }

    .final-score {
      font-size: 4rem;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 0.5rem;
    }

    .high-score {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .instructions {
      font-size: 0.9rem;
      color: #666;
      margin-top: 1rem;
    }

    .sound-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    // Audio Context for sound effects
    let audioCtx = null;
    let soundEnabled = true;
    let musicPlaying = false;
    let musicNodes = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // Background music generator
    function startBackgroundMusic() {
      if (musicPlaying || !soundEnabled) return;

      try {
        const ctx = getAudioContext();

        // Create nodes
        const masterGain = ctx.createGain();
        masterGain.gain.value = 0.15;
        masterGain.connect(ctx.destination);

        // Bass line
        const bassGain = ctx.createGain();
        bassGain.gain.value = 0.4;
        bassGain.connect(masterGain);

        // Melody
        const melodyGain = ctx.createGain();
        melodyGain.gain.value = 0.3;
        melodyGain.connect(masterGain);

        // Arpeggio
        const arpGain = ctx.createGain();
        arpGain.gain.value = 0.2;
        arpGain.connect(masterGain);

        // Musical notes (C major pentatonic)
        const bassNotes = [65.41, 82.41, 98.00, 82.41]; // C2, E2, G2, E2
        const melodyNotes = [523.25, 587.33, 659.25, 783.99, 659.25, 587.33]; // C5, D5, E5, G5, E5, D5
        const arpNotes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5

        const bpm = 120;
        const beatDuration = 60 / bpm;

        let bassIndex = 0;
        let melodyIndex = 0;
        let arpIndex = 0;
        let beatCount = 0;

        // Schedule notes
        function scheduleNotes() {
          if (!musicPlaying || !soundEnabled) return;

          const now = ctx.currentTime;

          // Bass (every 2 beats)
          if (beatCount % 2 === 0) {
            const bassOsc = ctx.createOscillator();
            const bassEnv = ctx.createGain();
            bassOsc.type = 'triangle';
            bassOsc.frequency.value = bassNotes[bassIndex % bassNotes.length];
            bassOsc.connect(bassEnv);
            bassEnv.connect(bassGain);
            bassEnv.gain.setValueAtTime(0.8, now);
            bassEnv.gain.exponentialRampToValueAtTime(0.01, now + beatDuration * 1.8);
            bassOsc.start(now);
            bassOsc.stop(now + beatDuration * 2);
            bassIndex++;
          }

          // Melody (every 4 beats)
          if (beatCount % 4 === 0) {
            const melOsc = ctx.createOscillator();
            const melEnv = ctx.createGain();
            melOsc.type = 'sine';
            melOsc.frequency.value = melodyNotes[melodyIndex % melodyNotes.length];
            melOsc.connect(melEnv);
            melEnv.connect(melodyGain);
            melEnv.gain.setValueAtTime(0.6, now);
            melEnv.gain.exponentialRampToValueAtTime(0.01, now + beatDuration * 3.5);
            melOsc.start(now);
            melOsc.stop(now + beatDuration * 4);
            melodyIndex++;
          }

          // Arpeggio (every beat)
          const arpOsc = ctx.createOscillator();
          const arpEnv = ctx.createGain();
          arpOsc.type = 'square';
          arpOsc.frequency.value = arpNotes[arpIndex % arpNotes.length];
          arpOsc.connect(arpEnv);
          arpEnv.connect(arpGain);
          arpEnv.gain.setValueAtTime(0.3, now);
          arpEnv.gain.exponentialRampToValueAtTime(0.01, now + beatDuration * 0.8);
          arpOsc.start(now);
          arpOsc.stop(now + beatDuration);
          arpIndex++;

          beatCount++;
        }

        // Start the loop
        musicPlaying = true;
        const intervalId = setInterval(() => {
          if (!musicPlaying || !soundEnabled) {
            clearInterval(intervalId);
            return;
          }
          scheduleNotes();
        }, beatDuration * 1000);

        musicNodes = {
          masterGain,
          intervalId
        };

        // Play first notes immediately
        scheduleNotes();

      } catch (e) {
        console.log('Music error:', e);
      }
    }

    function stopBackgroundMusic() {
      musicPlaying = false;
      if (musicNodes) {
        clearInterval(musicNodes.intervalId);
        try {
          musicNodes.masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        } catch (e) {}
        musicNodes = null;
      }
    }

    function toggleBackgroundMusic(enabled) {
      if (enabled && !musicPlaying) {
        startBackgroundMusic();
      } else if (!enabled) {
        stopBackgroundMusic();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        const now = ctx.currentTime;

        switch (type) {
          case 'drop':
            // Whoosh sound - descending frequency
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.15);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            oscillator.start(now);
            oscillator.stop(now + 0.15);
            break;

          case 'land':
            // Thud sound - low frequency burst
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(80, now);
            oscillator.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            oscillator.start(now);
            oscillator.stop(now + 0.1);
            break;

          case 'perfect':
            // Chime sound - ascending arpeggio
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'sine';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0, now + i * 0.08);
              gain.gain.linearRampToValueAtTime(0.2, now + i * 0.08 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
            return; // Early return since we handled multiple oscillators

          case 'fail':
            // Buzz/error sound
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, now);
            oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            oscillator.start(now);
            oscillator.stop(now + 0.3);
            break;

          case 'gameover':
            // Sad descending tone
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.8);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            oscillator.start(now);
            oscillator.stop(now + 0.8);
            break;

          case 'start':
            // Upbeat start sound
            const startNotes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            startNotes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'square';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0, now + i * 0.1);
              gain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.2);
            });
            return;
        }
      } catch (e) {
        // Audio not supported, fail silently
      }
    }

    // Game constants
    const BLOCK_HEIGHT = 30;
    const INITIAL_BLOCK_WIDTH = 200;
    const SWING_SPEED_BASE = 4;
    const DROP_SPEED = 8;
    const MAX_HEALTH = 3;
    const POINTS_NORMAL = 25;
    const POINTS_PERFECT = 50;
    const PERFECT_THRESHOLD = 5;

    // Color palette for blocks
    const COLORS = [
      '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
      '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
      '#F8B500', '#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9'
    ];

    function getBlockColor(index) {
      return COLORS[index % COLORS.length];
    }

    function TowerGame() {
      const canvasRef = useRef(null);
      const gameStateRef = useRef(null);
      const animationRef = useRef(null);

      const [gamePhase, setGamePhase] = useState('start'); // start, playing, gameover
      const [score, setScore] = useState(0);
      const [health, setHealth] = useState(MAX_HEALTH);
      const [showPerfect, setShowPerfect] = useState(false);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem('towerHighScore') || '0');
      });
      const [soundOn, setSoundOn] = useState(true);

      const toggleSound = () => {
        soundEnabled = !soundEnabled;
        setSoundOn(soundEnabled);
        if (gamePhase === 'playing') {
          toggleBackgroundMusic(soundEnabled);
        }
      };

      // Initialize game state
      const initGame = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const width = canvas.width;
        const height = canvas.height;

        gameStateRef.current = {
          blocks: [{
            x: (width - INITIAL_BLOCK_WIDTH) / 2,
            y: height - BLOCK_HEIGHT - 50,
            width: INITIAL_BLOCK_WIDTH,
            height: BLOCK_HEIGHT
          }],
          currentBlock: {
            x: 0,
            y: 100,
            width: INITIAL_BLOCK_WIDTH,
            height: BLOCK_HEIGHT,
            direction: 1,
            speed: SWING_SPEED_BASE,
            dropping: false,
            dropY: 100
          },
          cameraY: 0,
          targetCameraY: 0,
          perfectStreak: 0
        };

        setScore(0);
        setHealth(MAX_HEALTH);
      }, []);

      // Handle canvas resize
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const resize = () => {
          const container = canvas.parentElement;
          canvas.width = Math.min(500, window.innerWidth);
          canvas.height = window.innerHeight;

          if (gamePhase === 'start') {
            initGame();
          }
        };

        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, [gamePhase, initGame]);

      // Cleanup music on unmount
      useEffect(() => {
        return () => {
          stopBackgroundMusic();
        };
      }, []);

      // Game loop
      useEffect(() => {
        if (gamePhase !== 'playing') return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const state = gameStateRef.current;

        const gameLoop = () => {
          if (!state) return;

          const { blocks, currentBlock } = state;
          const lastBlock = blocks[blocks.length - 1];

          // Update current block position
          if (!currentBlock.dropping) {
            currentBlock.x += currentBlock.speed * currentBlock.direction;

            // Bounce off walls
            if (currentBlock.x <= 0) {
              currentBlock.x = 0;
              currentBlock.direction = 1;
            } else if (currentBlock.x + currentBlock.width >= canvas.width) {
              currentBlock.x = canvas.width - currentBlock.width;
              currentBlock.direction = -1;
            }
          } else {
            // Drop the block
            currentBlock.y += DROP_SPEED;

            const targetY = lastBlock.y - BLOCK_HEIGHT - state.cameraY;

            if (currentBlock.y >= targetY) {
              currentBlock.y = targetY;

              // Calculate overlap
              const blockLeft = currentBlock.x;
              const blockRight = currentBlock.x + currentBlock.width;
              const lastLeft = lastBlock.x;
              const lastRight = lastBlock.x + lastBlock.width;

              const overlapLeft = Math.max(blockLeft, lastLeft);
              const overlapRight = Math.min(blockRight, lastRight);
              const overlapWidth = overlapRight - overlapLeft;

              if (overlapWidth <= 0) {
                // Complete miss
                playSound('fail');
                setHealth(h => {
                  const newHealth = h - 1;
                  if (newHealth <= 0) {
                    stopBackgroundMusic();
                    playSound('gameover');
                    setGamePhase('gameover');
                    if (score > highScore) {
                      setHighScore(score);
                      localStorage.setItem('towerHighScore', score.toString());
                    }
                  }
                  return newHealth;
                });
                state.perfectStreak = 0;
              } else {
                // Successful stack
                const isPerfect = Math.abs(currentBlock.x - lastBlock.x) < PERFECT_THRESHOLD;

                if (isPerfect) {
                  playSound('perfect');
                  state.perfectStreak++;
                  const bonus = POINTS_PERFECT + (state.perfectStreak - 1) * 10;
                  setScore(s => s + bonus);
                  setShowPerfect(true);
                  setTimeout(() => setShowPerfect(false), 600);

                  // Perfect keeps same width
                  blocks.push({
                    x: lastBlock.x,
                    y: lastBlock.y - BLOCK_HEIGHT,
                    width: lastBlock.width,
                    height: BLOCK_HEIGHT
                  });
                } else {
                  playSound('land');
                  state.perfectStreak = 0;
                  setScore(s => s + POINTS_NORMAL);

                  // Cut the block
                  blocks.push({
                    x: overlapLeft,
                    y: lastBlock.y - BLOCK_HEIGHT,
                    width: overlapWidth,
                    height: BLOCK_HEIGHT
                  });
                }

                // Move camera up
                if (blocks.length > 5) {
                  state.targetCameraY = (blocks.length - 5) * BLOCK_HEIGHT;
                }
              }

              // Create new current block
              const newBlock = blocks[blocks.length - 1];
              const speedIncrease = Math.min(blocks.length * 0.15, 6);

              currentBlock.width = newBlock.width;
              currentBlock.x = currentBlock.direction > 0 ? 0 : canvas.width - currentBlock.width;
              currentBlock.y = Math.max(50, newBlock.y - BLOCK_HEIGHT * 3 - state.cameraY);
              currentBlock.dropping = false;
              currentBlock.speed = SWING_SPEED_BASE + speedIncrease;
            }
          }

          // Smooth camera movement
          state.cameraY += (state.targetCameraY - state.cameraY) * 0.1;

          // Render
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw gradient background
          const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
          gradient.addColorStop(0, '#1a1a2e');
          gradient.addColorStop(0.5, '#16213e');
          gradient.addColorStop(1, '#0f3460');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw stacked blocks
          blocks.forEach((block, i) => {
            const y = block.y - state.cameraY;
            if (y > -BLOCK_HEIGHT && y < canvas.height + BLOCK_HEIGHT) {
              ctx.fillStyle = getBlockColor(i);
              ctx.fillRect(block.x, y, block.width, block.height);

              // Block border
              ctx.strokeStyle = 'rgba(255,255,255,0.3)';
              ctx.lineWidth = 2;
              ctx.strokeRect(block.x, y, block.width, block.height);
            }
          });

          // Draw current block
          ctx.fillStyle = getBlockColor(blocks.length);
          ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2;
          ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);

          // Draw guide line
          if (!currentBlock.dropping) {
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(currentBlock.x + currentBlock.width / 2, currentBlock.y + currentBlock.height);
            ctx.lineTo(currentBlock.x + currentBlock.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          animationRef.current = requestAnimationFrame(gameLoop);
        };

        animationRef.current = requestAnimationFrame(gameLoop);

        return () => {
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, [gamePhase, score, highScore]);

      // Handle tap/click
      const handleTap = useCallback(() => {
        if (gamePhase !== 'playing') return;

        const state = gameStateRef.current;
        if (state && !state.currentBlock.dropping) {
          playSound('drop');
          state.currentBlock.dropping = true;
        }
      }, [gamePhase]);

      // Start game
      const startGame = () => {
        playSound('start');
        initGame();
        setGamePhase('playing');
        setTimeout(() => startBackgroundMusic(), 500);
      };

      // Sound toggle button component
      const SoundButton = () => html`
        <button class="sound-toggle" onClick=${toggleSound}>
          ${soundOn ? '🔊' : '🔇'}
        </button>
      `;

      // Render start screen
      if (gamePhase === 'start') {
        return html`
          <div>
            <canvas ref=${canvasRef} onClick=${startGame} style="cursor: pointer" />
            <div class="overlay">
              <div class="title">🏗️ Tower</div>
              <div class="subtitle">Stack blocks to build your tower!</div>
              <button class="btn" onClick=${startGame}>Start Game</button>
              <div class="instructions">Tap or click to drop blocks</div>
            </div>
            <${SoundButton} />
          </div>
        `;
      }

      // Render game over screen
      if (gamePhase === 'gameover') {
        return html`
          <div>
            <canvas ref=${canvasRef} />
            <div class="overlay">
              <div class="title">Game Over</div>
              <div class="final-score">${score}</div>
              <div class="high-score">High Score: ${highScore}</div>
              <button class="btn" onClick=${startGame}>Play Again</button>
            </div>
            <${SoundButton} />
          </div>
        `;
      }

      // Render playing screen
      return html`
        <div>
          <canvas
            ref=${canvasRef}
            onClick=${handleTap}
            onTouchStart=${(e) => { e.preventDefault(); handleTap(); }}
            style="cursor: pointer"
          />
          <div class="score-display">${score}</div>
          <div class="health-display">
            ${Array(health).fill('❤️').join('')}
            ${Array(MAX_HEALTH - health).fill('🖤').join('')}
          </div>
          ${showPerfect && html`<div class="perfect-text">PERFECT!</div>`}
          <${SoundButton} />
        </div>
      `;
    }

    // Mount the app
    render(html`<${TowerGame} />`, document.getElementById('app'));
  </script>
</body>
</html>
