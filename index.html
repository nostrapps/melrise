<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Skyrise - Tower Stacking Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100vh;
      max-width: 500px;
      position: relative;
    }

    canvas {
      display: block;
      background: transparent;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .title {
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.2rem;
      color: #aaa;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 1rem 3rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      z-index: 5;
    }

    .health-display {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      z-index: 5;
    }

    .perfect-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700;
      animation: perfectPop 0.6s ease-out forwards;
      z-index: 5;
      pointer-events: none;
    }

    @keyframes perfectPop {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(1);
      }
    }

    .combo-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }

    .streak-text {
      font-size: 1.5rem;
      font-weight: bold;
      text-transform: uppercase;
      animation: streakPop 0.8s ease-out forwards;
    }

    .streak-2 { color: #4ECDC4; text-shadow: 0 0 15px #4ECDC4; }
    .streak-3 { color: #FFD700; text-shadow: 0 0 20px #FFD700; font-size: 1.8rem; }
    .streak-5 { color: #FF6B6B; text-shadow: 0 0 25px #FF6B6B; font-size: 2.2rem; }
    .streak-7 { color: #FF00FF; text-shadow: 0 0 30px #FF00FF; font-size: 2.5rem; }
    .streak-10 { color: #00FFFF; text-shadow: 0 0 40px #00FFFF, 0 0 60px #00FFFF; font-size: 3rem; }

    @keyframes streakPop {
      0% {
        opacity: 1;
        transform: scale(0.3) rotate(-10deg);
      }
      30% {
        transform: scale(1.3) rotate(5deg);
      }
      50% {
        transform: scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: scale(1.5) translateY(-30px);
      }
    }

    .combo-number {
      font-size: 4rem;
      font-weight: bold;
      color: #fff;
      animation: comboPulse 0.5s ease-out forwards;
    }

    @keyframes comboPulse {
      0% {
        transform: scale(2);
        opacity: 1;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    .multiplier-display {
      position: absolute;
      top: 60px;
      left: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #4ECDC4;
      text-shadow: 0 0 10px #4ECDC4;
      z-index: 5;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .multiplier-display.active {
      opacity: 1;
    }

    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      animation: flashEffect 0.3s ease-out forwards;
    }

    .flash-gold { background: radial-gradient(circle, rgba(255,215,0,0.4) 0%, transparent 70%); }
    .flash-fire { background: radial-gradient(circle, rgba(255,107,107,0.5) 0%, transparent 70%); }
    .flash-epic { background: radial-gradient(circle, rgba(255,0,255,0.5) 0%, transparent 70%); }
    .flash-legendary { background: radial-gradient(circle, rgba(0,255,255,0.6) 0%, transparent 70%); }

    @keyframes flashEffect {
      0% { opacity: 1; transform: scale(0.8); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    .shake {
      animation: shakeEffect 0.3s ease-out;
    }

    @keyframes shakeEffect {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }

    .shake-heavy {
      animation: shakeHeavy 0.4s ease-out;
    }

    @keyframes shakeHeavy {
      0%, 100% { transform: translate(0, 0); }
      10%, 50%, 90% { transform: translate(-8px, -3px); }
      30%, 70% { transform: translate(8px, 3px); }
      40%, 60% { transform: translate(-5px, 5px); }
      80% { transform: translate(5px, -5px); }
    }

    .final-score {
      font-size: 4rem;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 0.5rem;
    }

    .high-score {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
    }

    .instructions {
      font-size: 0.9rem;
      color: #666;
      margin-top: 1rem;
    }

    .sound-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .trophy-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #ffd700;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .trophy-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: scale(1.1);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
    }

    .modal-close {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
      line-height: 1;
    }

    .modal-close:hover {
      color: #fff;
    }

    .login-section {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .login-status {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #4ECDC4;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .login-status.logged-out {
      color: #888;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-logout {
      width: 100%;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: #888;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .privkey-section {
      margin-top: 1rem;
    }

    .privkey-input {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .privkey-input::placeholder {
      color: #666;
    }

    .warning-text {
      font-size: 0.75rem;
      color: #ff6b6b;
      margin-top: 0.5rem;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1rem 0;
      color: #666;
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .divider span {
      padding: 0 1rem;
    }

    .leaderboard-list {
      list-style: none;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin-bottom: 0.5rem;
    }

    .leaderboard-item.you {
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.4);
    }

    .leaderboard-rank {
      width: 2rem;
      font-weight: bold;
      color: #ffd700;
    }

    .leaderboard-rank.gold { color: #ffd700; }
    .leaderboard-rank.silver { color: #c0c0c0; }
    .leaderboard-rank.bronze { color: #cd7f32; }

    .leaderboard-name {
      flex: 1;
      color: #fff;
      font-size: 0.9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaderboard-score {
      font-weight: bold;
      color: #4ECDC4;
      font-size: 1rem;
    }

    .leaderboard-loading, .leaderboard-empty {
      text-align: center;
      color: #888;
      padding: 2rem;
    }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(78, 205, 196, 0.9);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 25px;
      font-weight: bold;
      font-size: 0.9rem;
      z-index: 200;
      animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translate(-50%, 0); }
      to { opacity: 0; transform: translate(-50%, -20px); }
    }

    .powered-by {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #666;
    }

    .powered-by a {
      color: #667eea;
      text-decoration: none;
    }

    .powered-by a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef, useCallback } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';
    import * as nostr from './nostr.js';

    const html = htm.bind(h);

    // Audio Context for sound effects
    let audioCtx = null;
    let soundEnabled = true;
    let musicPlaying = false;
    let musicNodes = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    // C64 SID-style Background Music Generator
    // Inspired by Rob Hubbard, Martin Galway, Ben Daglish
    function startBackgroundMusic() {
      if (musicPlaying || !soundEnabled) return;

      try {
        const ctx = getAudioContext();

        // Master output with compression for that punchy SID feel
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -20;
        compressor.knee.value = 10;
        compressor.ratio.value = 4;
        compressor.connect(ctx.destination);

        const masterGain = ctx.createGain();
        masterGain.gain.value = 0.25;
        masterGain.connect(compressor);

        // Channel gains (3 channels like SID)
        const bassGain = ctx.createGain();
        bassGain.gain.value = 0.5;
        bassGain.connect(masterGain);

        const arpGain = ctx.createGain();
        arpGain.gain.value = 0.18;
        arpGain.connect(masterGain);

        const leadGain = ctx.createGain();
        leadGain.gain.value = 0.35;
        leadGain.connect(masterGain);

        // Note frequencies (A minor - classic game music key)
        const NOTE = {
          A2: 110.00, B2: 123.47, C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00,
          A3: 220.00, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
          A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
          A5: 880.00
        };

        // Chord progression: Am - F - C - G (i - VI - III - VII in A minor)
        // Classic dramatic game music progression
        // Using lower octave for smoother arpeggio
        const chords = [
          { bass: NOTE.A2, arp: [NOTE.A3, NOTE.C4, NOTE.E4] },      // Am
          { bass: NOTE.F3, arp: [NOTE.F3, NOTE.A3, NOTE.C4] },      // F
          { bass: NOTE.C3, arp: [NOTE.C3, NOTE.E3, NOTE.G3] },      // C
          { bass: NOTE.G3, arp: [NOTE.G3, NOTE.B3, NOTE.D4] }       // G
        ];

        // Lead melody (Rob Hubbard style - energetic, memorable)
        const melody = [
          // Phrase 1
          NOTE.E5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.D5, NOTE.E5, NOTE.A4, 0,
          // Phrase 2
          NOTE.E5, NOTE.G5, NOTE.A5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, 0,
          // Phrase 3
          NOTE.C5, NOTE.D5, NOTE.E5, NOTE.G5, NOTE.E5, NOTE.D5, NOTE.C5, NOTE.D5,
          // Phrase 4
          NOTE.E5, NOTE.D5, NOTE.C5, NOTE.A4, NOTE.G4, NOTE.A4, 0, 0
        ];

        const BPM = 140; // Upbeat tempo like classic C64 games
        const beatMs = 60000 / BPM;
        const arpSpeed = 80; // Slower, smoother arpeggio (12.5Hz)

        let chordIndex = 0;
        let beatInChord = 0;
        let melodyIndex = 0;
        let arpNoteIndex = 0;

        // Create pulse-like wave for lead (PWM simulation)
        function createPulseOsc(freq, pulseWidth = 0.25) {
          const osc = ctx.createOscillator();
          const real = new Float32Array(32);
          const imag = new Float32Array(32);
          real[0] = 0;
          imag[0] = 0;
          for (let i = 1; i < 32; i++) {
            // Attempt pulse-like harmonics
            imag[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * pulseWidth);
          }
          const wave = ctx.createPeriodicWave(real, imag);
          osc.setPeriodicWave(wave);
          osc.frequency.value = freq;
          return osc;
        }

        // Bass note (triangle wave - classic SID bass)
        function playBass(freq, duration) {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          osc.connect(env);
          env.connect(bassGain);
          const now = ctx.currentTime;
          env.gain.setValueAtTime(0.8, now);
          env.gain.setValueAtTime(0.6, now + 0.05);
          env.gain.exponentialRampToValueAtTime(0.01, now + duration - 0.05);
          osc.start(now);
          osc.stop(now + duration);
        }

        // Lead note with vibrato (SID style)
        function playLead(freq, duration) {
          if (freq === 0) return;
          const osc = createPulseOsc(freq, 0.15 + Math.random() * 0.2);
          const env = ctx.createGain();
          const vibrato = ctx.createOscillator();
          const vibratoGain = ctx.createGain();

          vibrato.frequency.value = 5; // 5Hz vibrato
          vibratoGain.gain.value = freq * 0.02; // 2% pitch variation
          vibrato.connect(vibratoGain);
          vibratoGain.connect(osc.frequency);

          osc.connect(env);
          env.connect(leadGain);

          const now = ctx.currentTime;
          env.gain.setValueAtTime(0, now);
          env.gain.linearRampToValueAtTime(0.7, now + 0.02);
          env.gain.setValueAtTime(0.5, now + 0.08);
          env.gain.exponentialRampToValueAtTime(0.01, now + duration - 0.02);

          vibrato.start(now);
          osc.start(now);
          vibrato.stop(now + duration);
          osc.stop(now + duration);
        }

        // Smooth arpeggio with filter for warm sound
        let arpIntervalId = null;
        function startArpeggio() {
          // Create a shared filter for warmth
          const arpFilter = ctx.createBiquadFilter();
          arpFilter.type = 'lowpass';
          arpFilter.frequency.value = 1200;
          arpFilter.Q.value = 1;
          arpFilter.connect(arpGain);

          arpIntervalId = setInterval(() => {
            if (!musicPlaying || !soundEnabled) {
              clearInterval(arpIntervalId);
              return;
            }
            const chord = chords[chordIndex];
            const freq = chord.arp[arpNoteIndex % chord.arp.length];
            arpNoteIndex++;

            const osc = ctx.createOscillator();
            const env = ctx.createGain();
            osc.type = 'triangle'; // Softer waveform
            osc.frequency.value = freq;
            osc.connect(env);
            env.connect(arpFilter);

            const now = ctx.currentTime;
            const duration = arpSpeed / 1000;
            // Soft attack and release
            env.gain.setValueAtTime(0, now);
            env.gain.linearRampToValueAtTime(0.5, now + duration * 0.1);
            env.gain.setValueAtTime(0.4, now + duration * 0.3);
            env.gain.exponentialRampToValueAtTime(0.01, now + duration * 0.95);
            osc.start(now);
            osc.stop(now + duration);
          }, arpSpeed);
        }

        // Main beat scheduler
        function scheduleBeat() {
          if (!musicPlaying || !soundEnabled) return;

          const chord = chords[chordIndex];

          // Bass on beats 1 and 3
          if (beatInChord === 0 || beatInChord === 2) {
            playBass(chord.bass, beatMs / 1000 * 1.8);
          }

          // Melody every beat
          playLead(melody[melodyIndex], beatMs / 1000 * 0.9);
          melodyIndex = (melodyIndex + 1) % melody.length;

          beatInChord++;
          if (beatInChord >= 4) {
            beatInChord = 0;
            chordIndex = (chordIndex + 1) % chords.length;
          }
        }

        // Start the music
        musicPlaying = true;
        startArpeggio();
        scheduleBeat();
        const mainIntervalId = setInterval(() => {
          if (!musicPlaying || !soundEnabled) {
            clearInterval(mainIntervalId);
            clearInterval(arpIntervalId);
            return;
          }
          scheduleBeat();
        }, beatMs);

        musicNodes = {
          masterGain,
          intervalId: mainIntervalId,
          arpIntervalId
        };

      } catch (e) {
        console.log('Music error:', e);
      }
    }

    function stopBackgroundMusic() {
      musicPlaying = false;
      if (musicNodes) {
        clearInterval(musicNodes.intervalId);
        if (musicNodes.arpIntervalId) clearInterval(musicNodes.arpIntervalId);
        try {
          musicNodes.masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        } catch (e) {}
        musicNodes = null;
      }
    }

    function toggleBackgroundMusic(enabled) {
      if (enabled && !musicPlaying) {
        startBackgroundMusic();
      } else if (!enabled) {
        stopBackgroundMusic();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        const now = ctx.currentTime;

        switch (type) {
          case 'drop':
            // Whoosh sound - descending frequency
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(150, now + 0.15);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            oscillator.start(now);
            oscillator.stop(now + 0.15);
            break;

          case 'land':
            // Thud sound - low frequency burst
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(80, now);
            oscillator.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            oscillator.start(now);
            oscillator.stop(now + 0.1);
            break;

          case 'perfect':
            // Simple chime for first perfect
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'sine';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0, now + i * 0.08);
              gain.gain.linearRampToValueAtTime(0.2, now + i * 0.08 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.3);
            });
            return;

          case 'fail':
            // Buzz/error sound
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, now);
            oscillator.frequency.exponentialRampToValueAtTime(80, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            oscillator.start(now);
            oscillator.stop(now + 0.3);
            break;

          case 'gameover':
            // Sad descending tone
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(400, now);
            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.8);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
            oscillator.start(now);
            oscillator.stop(now + 0.8);
            break;

          case 'start':
            // Upbeat start sound
            const startNotes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            startNotes.forEach((freq, i) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'square';
              osc.frequency.value = freq;
              gain.gain.setValueAtTime(0, now + i * 0.1);
              gain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.2);
              osc.start(now + i * 0.1);
              osc.stop(now + i * 0.1 + 0.2);
            });
            return;
        }
      } catch (e) {
        // Audio not supported, fail silently
      }
    }

    // Streak-based sound effects - escalates with combo!
    function playStreakSound(streak) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        // Base pitch increases with streak
        const basePitch = 400 + (streak * 50);

        if (streak === 2) {
          // Double! - Quick double chime
          [0, 0.1].forEach((delay, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = basePitch + (i * 200);
            gain.gain.setValueAtTime(0, now + delay);
            gain.gain.linearRampToValueAtTime(0.25, now + delay + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.2);
            osc.start(now + delay);
            osc.stop(now + delay + 0.2);
          });
        } else if (streak === 3) {
          // Triple! - Triumphant chord
          [1, 1.25, 1.5].forEach((mult, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.value = basePitch * mult;
            gain.gain.setValueAtTime(0, now + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.2, now + i * 0.05 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.4);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.4);
          });
        } else if (streak >= 5 && streak < 10) {
          // On Fire! - Rising arpeggio with power
          const fireNotes = [1, 1.25, 1.5, 2];
          fireNotes.forEach((mult, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'square';
            osc.frequency.value = basePitch * mult;
            gain.gain.setValueAtTime(0, now + i * 0.06);
            gain.gain.linearRampToValueAtTime(0.15, now + i * 0.06 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.3);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.3);
          });
        } else if (streak >= 10) {
          // LEGENDARY! - Epic fanfare
          const epicNotes = [1, 1.25, 1.5, 1.25, 1.5, 2];
          epicNotes.forEach((mult, i) => {
            const osc = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sawtooth';
            osc2.type = 'sine';
            osc.frequency.value = basePitch * mult;
            osc2.frequency.value = basePitch * mult * 2;
            gain.gain.setValueAtTime(0, now + i * 0.08);
            gain.gain.linearRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.5);
            osc.start(now + i * 0.08);
            osc2.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.5);
            osc2.stop(now + i * 0.08 + 0.5);
          });
        }
      } catch (e) {
        // Audio not supported
      }
    }

    // Game constants
    const BLOCK_HEIGHT = 30;
    const INITIAL_BLOCK_WIDTH = 200;
    const SWING_SPEED_BASE = 4;
    const DROP_SPEED = 8;
    const MAX_HEALTH = 3;
    const POINTS_NORMAL = 25;
    const POINTS_PERFECT = 50;
    const PERFECT_THRESHOLD = 5;

    // Color palette for blocks
    const COLORS = [
      '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',
      '#DDA0DD', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E9',
      '#F8B500', '#FF6F61', '#6B5B95', '#88B04B', '#F7CAC9'
    ];

    function getBlockColor(index) {
      return COLORS[index % COLORS.length];
    }

    function TowerGame() {
      const canvasRef = useRef(null);
      const gameStateRef = useRef(null);
      const animationRef = useRef(null);

      const [gamePhase, setGamePhase] = useState('start'); // start, playing, gameover
      const [score, setScore] = useState(0);
      const [health, setHealth] = useState(MAX_HEALTH);
      const [showPerfect, setShowPerfect] = useState(false);
      const [highScore, setHighScore] = useState(() => {
        return parseInt(localStorage.getItem('towerHighScore') || '0');
      });
      const [soundOn, setSoundOn] = useState(true);
      const [streak, setStreak] = useState(0);
      const [streakText, setStreakText] = useState('');
      const [showFlash, setShowFlash] = useState('');
      const [shake, setShake] = useState('');

      // Nostr state
      const [nostrUser, setNostrUser] = useState(null);
      const [showLeaderboard, setShowLeaderboard] = useState(false);
      const [leaderboard, setLeaderboard] = useState([]);
      const [leaderboardLoading, setLeaderboardLoading] = useState(false);
      const [toast, setToast] = useState('');
      const [privkeyInput, setPrivkeyInput] = useState('');

      // Try to restore Nostr session on mount
      useEffect(() => {
        nostr.restoreSession().then(pubkey => {
          if (pubkey) setNostrUser({ pubkey });
        });
      }, []);

      // Show toast notification
      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(''), 3000);
      };

      // Refresh leaderboard
      const refreshLeaderboard = async () => {
        setLeaderboardLoading(true);
        try {
          const scores = await nostr.fetchLeaderboard(10);
          const pubkeys = scores.map(s => s.pubkey);
          const metadata = await nostr.fetchMetadata(pubkeys);
          const enriched = scores.map(s => ({
            ...s,
            name: metadata.get(s.pubkey)?.name || nostr.formatPubkey(s.pubkey)
          }));
          setLeaderboard(enriched);
        } catch (err) {
          console.error('Leaderboard error:', err);
        }
        setLeaderboardLoading(false);
      };

      // Login with extension
      const handleExtensionLogin = async () => {
        try {
          const pubkey = await nostr.loginWithExtension();
          setNostrUser({ pubkey });
          showToast('Logged in!');
          refreshLeaderboard();
        } catch (err) {
          showToast(err.message);
        }
      };

      // Login with private key
      const handlePrivkeyLogin = async () => {
        if (!privkeyInput.trim()) return;
        try {
          const pubkey = await nostr.loginWithPrivkey(privkeyInput);
          setNostrUser({ pubkey });
          setPrivkeyInput('');
          showToast('Logged in!');
          refreshLeaderboard();
        } catch (err) {
          showToast(err.message);
        }
      };

      // Logout
      const handleLogout = () => {
        nostr.logout();
        setNostrUser(null);
        showToast('Logged out');
      };

      // Publish score to Nostr
      const publishScore = async (finalScore) => {
        if (!nostrUser) return;
        try {
          const result = await nostr.publishScore(finalScore);
          if (result) {
            showToast('High score saved to Nostr!');
            setTimeout(refreshLeaderboard, 1500);
          }
        } catch (err) {
          console.error('Publish error:', err);
        }
      };

      // Get streak message and class
      const getStreakInfo = (count) => {
        if (count >= 10) return { text: 'LEGENDARY!', class: 'streak-10', flash: 'flash-legendary' };
        if (count >= 7) return { text: 'UNSTOPPABLE!', class: 'streak-7', flash: 'flash-epic' };
        if (count >= 5) return { text: 'ON FIRE!', class: 'streak-5', flash: 'flash-fire' };
        if (count >= 3) return { text: 'AMAZING!', class: 'streak-3', flash: 'flash-gold' };
        if (count >= 2) return { text: 'NICE!', class: 'streak-2', flash: 'flash-gold' };
        return { text: '', class: '', flash: '' };
      };

      const toggleSound = () => {
        soundEnabled = !soundEnabled;
        setSoundOn(soundEnabled);
        if (gamePhase === 'playing') {
          toggleBackgroundMusic(soundEnabled);
        }
      };

      // Initialize game state
      const initGame = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const width = canvas.width;
        const height = canvas.height;

        gameStateRef.current = {
          blocks: [{
            x: (width - INITIAL_BLOCK_WIDTH) / 2,
            y: height - BLOCK_HEIGHT - 50,
            width: INITIAL_BLOCK_WIDTH,
            height: BLOCK_HEIGHT
          }],
          currentBlock: {
            x: 0,
            y: 120,
            width: INITIAL_BLOCK_WIDTH,
            height: BLOCK_HEIGHT,
            direction: 1,
            speed: SWING_SPEED_BASE,
            dropping: false
          },
          cameraY: 0,
          targetCameraY: 0,
          perfectStreak: 0
        };

        setScore(0);
        setHealth(MAX_HEALTH);
      }, []);

      // Handle canvas resize
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const resize = () => {
          const container = canvas.parentElement;
          canvas.width = Math.min(500, window.innerWidth);
          canvas.height = window.innerHeight;

          if (gamePhase === 'start') {
            initGame();
          }
        };

        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, [gamePhase, initGame]);

      // Cleanup music on unmount
      useEffect(() => {
        return () => {
          stopBackgroundMusic();
        };
      }, []);

      // Game loop
      useEffect(() => {
        if (gamePhase !== 'playing') return;

        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const state = gameStateRef.current;

        const gameLoop = () => {
          if (!state) return;

          const { blocks, currentBlock } = state;
          const lastBlock = blocks[blocks.length - 1];

          // Update current block position
          if (!currentBlock.dropping) {
            currentBlock.x += currentBlock.speed * currentBlock.direction;

            // Bounce off walls
            if (currentBlock.x <= 0) {
              currentBlock.x = 0;
              currentBlock.direction = 1;
            } else if (currentBlock.x + currentBlock.width >= canvas.width) {
              currentBlock.x = canvas.width - currentBlock.width;
              currentBlock.direction = -1;
            }
          } else {
            // Drop the block
            currentBlock.y += DROP_SPEED;

            // Target is the screen position where the new block should land
            const targetScreenY = (lastBlock.y - BLOCK_HEIGHT) - state.cameraY;

            if (currentBlock.y >= targetScreenY) {
              currentBlock.y = targetScreenY;

              // Calculate overlap
              const blockLeft = currentBlock.x;
              const blockRight = currentBlock.x + currentBlock.width;
              const lastLeft = lastBlock.x;
              const lastRight = lastBlock.x + lastBlock.width;

              const overlapLeft = Math.max(blockLeft, lastLeft);
              const overlapRight = Math.min(blockRight, lastRight);
              const overlapWidth = overlapRight - overlapLeft;

              if (overlapWidth <= 0) {
                // Complete miss
                playSound('fail');
                setHealth(h => {
                  const newHealth = h - 1;
                  if (newHealth <= 0) {
                    stopBackgroundMusic();
                    playSound('gameover');
                    setGamePhase('gameover');
                    if (score > highScore) {
                      setHighScore(score);
                      localStorage.setItem('towerHighScore', score.toString());
                    }
                    // Publish score to Nostr if logged in
                    publishScore(score);
                  }
                  return newHealth;
                });
                state.perfectStreak = 0;
                setStreak(0);
              } else {
                // Successful stack
                const isPerfect = Math.abs(currentBlock.x - lastBlock.x) < PERFECT_THRESHOLD;

                if (isPerfect) {
                  state.perfectStreak++;
                  const currentStreak = state.perfectStreak;
                  const bonus = POINTS_PERFECT + (currentStreak - 1) * 10;
                  setScore(s => s + bonus);
                  setStreak(currentStreak);

                  // Play sound - basic perfect or streak sound
                  if (currentStreak >= 2) {
                    playStreakSound(currentStreak);
                  } else {
                    playSound('perfect');
                  }

                  // Visual feedback based on streak
                  const info = getStreakInfo(currentStreak);
                  if (info.text) {
                    setStreakText(info.text);
                    setShowFlash(info.flash);
                    setShake(currentStreak >= 5 ? 'shake-heavy' : 'shake');
                    setTimeout(() => {
                      setStreakText('');
                      setShowFlash('');
                      setShake('');
                    }, 800);
                  } else {
                    setShowPerfect(true);
                    setTimeout(() => setShowPerfect(false), 600);
                  }

                  // Perfect keeps same width
                  blocks.push({
                    x: lastBlock.x,
                    y: lastBlock.y - BLOCK_HEIGHT,
                    width: lastBlock.width,
                    height: BLOCK_HEIGHT
                  });
                } else {
                  playSound('land');
                  state.perfectStreak = 0;
                  setStreak(0);
                  setScore(s => s + POINTS_NORMAL);

                  // Cut the block
                  blocks.push({
                    x: overlapLeft,
                    y: lastBlock.y - BLOCK_HEIGHT,
                    width: overlapWidth,
                    height: BLOCK_HEIGHT
                  });
                }

                // Move camera up - keep top of tower at a comfortable screen position
                const topBlockScreenY = canvas.height - (blocks.length * BLOCK_HEIGHT) - 50;
                const desiredTopY = canvas.height * 0.6; // Keep top block at 60% down the screen
                if (topBlockScreenY < desiredTopY) {
                  state.targetCameraY = desiredTopY - topBlockScreenY;
                }
              }

              // Create new current block
              const newBlock = blocks[blocks.length - 1];
              const speedIncrease = Math.min(blocks.length * 0.15, 6);

              currentBlock.width = newBlock.width;
              currentBlock.x = currentBlock.direction > 0 ? 0 : canvas.width - currentBlock.width;
              currentBlock.y = 120; // Fixed screen position for swinging block
              currentBlock.dropping = false;
              currentBlock.speed = SWING_SPEED_BASE + speedIncrease;
            }
          }

          // Smooth camera movement (faster follow)
          state.cameraY += (state.targetCameraY - state.cameraY) * 0.15;

          // Render
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Draw gradient background
          const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
          gradient.addColorStop(0, '#1a1a2e');
          gradient.addColorStop(0.5, '#16213e');
          gradient.addColorStop(1, '#0f3460');
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Draw stacked blocks
          blocks.forEach((block, i) => {
            const y = block.y - state.cameraY;
            if (y > -BLOCK_HEIGHT && y < canvas.height + BLOCK_HEIGHT) {
              ctx.fillStyle = getBlockColor(i);
              ctx.fillRect(block.x, y, block.width, block.height);

              // Block border
              ctx.strokeStyle = 'rgba(255,255,255,0.3)';
              ctx.lineWidth = 2;
              ctx.strokeRect(block.x, y, block.width, block.height);
            }
          });

          // Draw current block
          ctx.fillStyle = getBlockColor(blocks.length);
          ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2;
          ctx.strokeRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);

          // Draw guide line
          if (!currentBlock.dropping) {
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(currentBlock.x + currentBlock.width / 2, currentBlock.y + currentBlock.height);
            ctx.lineTo(currentBlock.x + currentBlock.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          animationRef.current = requestAnimationFrame(gameLoop);
        };

        animationRef.current = requestAnimationFrame(gameLoop);

        return () => {
          if (animationRef.current) {
            cancelAnimationFrame(animationRef.current);
          }
        };
      }, [gamePhase, score, highScore]);

      // Handle tap/click
      const handleTap = useCallback(() => {
        if (gamePhase !== 'playing') return;

        const state = gameStateRef.current;
        if (state && !state.currentBlock.dropping) {
          playSound('drop');
          state.currentBlock.dropping = true;
        }
      }, [gamePhase]);

      // Start game
      const startGame = () => {
        playSound('start');
        initGame();
        setGamePhase('playing');
        setTimeout(() => startBackgroundMusic(), 500);
      };

      // Sound toggle button component
      const SoundButton = () => html`
        <button class="sound-toggle" onClick=${toggleSound}>
          ${soundOn ? '🔊' : '🔇'}
        </button>
      `;

      // Trophy button to open leaderboard
      const TrophyButton = () => html`
        <button class="trophy-btn" onClick=${() => { setShowLeaderboard(true); refreshLeaderboard(); }}>
          🏆
        </button>
      `;

      // Leaderboard modal
      const LeaderboardModal = () => {
        if (!showLeaderboard) return null;

        const hasExtension = nostr.hasExtension();

        return html`
          <div class="modal-overlay" onClick=${(e) => e.target === e.currentTarget && setShowLeaderboard(false)}>
            <div class="modal-content">
              <div class="modal-header">
                <div class="modal-title">🏆 Leaderboard</div>
                <button class="modal-close" onClick=${() => setShowLeaderboard(false)}>×</button>
              </div>

              <div class="login-section">
                ${nostrUser ? html`
                  <div class="login-status">
                    ✓ Logged in as ${nostr.formatPubkey(nostrUser.pubkey)}
                  </div>
                  <button class="btn-logout" onClick=${handleLogout}>Logout</button>
                ` : html`
                  <div class="login-status logged-out">Not logged in</div>
                  ${hasExtension && html`
                    <button class="btn-login" onClick=${handleExtensionLogin}>
                      Login with Extension
                    </button>
                  `}
                  <div class="privkey-section">
                    ${!hasExtension && html`<div class="divider"><span>or</span></div>`}
                    <input
                      type="password"
                      class="privkey-input"
                      placeholder="Enter nsec or hex private key"
                      value=${privkeyInput}
                      onInput=${(e) => setPrivkeyInput(e.target.value)}
                      onKeyDown=${(e) => e.key === 'Enter' && handlePrivkeyLogin()}
                    />
                    <button class="btn-login" onClick=${handlePrivkeyLogin} disabled=${!privkeyInput.trim()}>
                      Login with Key
                    </button>
                    <div class="warning-text">⚠️ Using a browser extension is safer</div>
                  </div>
                `}
              </div>

              ${leaderboardLoading ? html`
                <div class="leaderboard-loading">Loading...</div>
              ` : leaderboard.length === 0 ? html`
                <div class="leaderboard-empty">No scores yet. Be the first!</div>
              ` : html`
                <ul class="leaderboard-list">
                  ${leaderboard.map((entry, i) => html`
                    <li class="leaderboard-item ${nostrUser && entry.pubkey === nostrUser.pubkey ? 'you' : ''}">
                      <span class="leaderboard-rank ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''}">#${i + 1}</span>
                      <span class="leaderboard-name">${entry.name}</span>
                      <span class="leaderboard-score">${entry.score.toLocaleString()}</span>
                    </li>
                  `)}
                </ul>
              `}

              <div class="powered-by">
                Powered by <a href="https://nostr.com" target="_blank">Nostr</a>
              </div>
            </div>
          </div>
        `;
      };

      // Toast notification
      const Toast = () => toast ? html`<div class="toast">${toast}</div>` : null;

      // Render start screen
      if (gamePhase === 'start') {
        return html`
          <div>
            <canvas ref=${canvasRef} onClick=${startGame} style="cursor: pointer" />
            <div class="overlay">
              <div class="title">🏗️ Skyrise</div>
              <div class="subtitle">Stack blocks to build your tower!</div>
              <button class="btn" onClick=${startGame}>Start Game</button>
              <div class="instructions">Tap or click to drop blocks</div>
            </div>
            <${TrophyButton} />
            <${SoundButton} />
            <${LeaderboardModal} />
            <${Toast} />
          </div>
        `;
      }

      // Render game over screen
      if (gamePhase === 'gameover') {
        return html`
          <div>
            <canvas ref=${canvasRef} />
            <div class="overlay">
              <div class="title">Game Over</div>
              <div class="final-score">${score}</div>
              <div class="high-score">High Score: ${highScore}</div>
              <button class="btn" onClick=${startGame}>Play Again</button>
            </div>
            <${TrophyButton} />
            <${SoundButton} />
            <${LeaderboardModal} />
            <${Toast} />
          </div>
        `;
      }

      // Render playing screen
      const streakInfo = getStreakInfo(streak);

      return html`
        <div class=${shake}>
          <canvas
            ref=${canvasRef}
            onClick=${handleTap}
            onTouchStart=${(e) => { e.preventDefault(); handleTap(); }}
            style="cursor: pointer"
          />
          <div class="score-display">${score}</div>
          <div class="health-display">
            ${Array(health).fill('❤️').join('')}
            ${Array(MAX_HEALTH - health).fill('🖤').join('')}
          </div>
          ${streak >= 2 && html`
            <div class="multiplier-display active">
              ${streak}x COMBO
            </div>
          `}
          ${showPerfect && html`<div class="perfect-text">PERFECT!</div>`}
          ${streakText && html`
            <div class="combo-container">
              <div class="combo-number">${streak}x</div>
              <div class="streak-text ${streakInfo.class}">${streakText}</div>
            </div>
          `}
          ${showFlash && html`<div class="screen-flash ${showFlash}"></div>`}
          <${TrophyButton} />
          <${SoundButton} />
          <${LeaderboardModal} />
          <${Toast} />
        </div>
      `;
    }

    // Mount the app
    render(html`<${TowerGame} />`, document.getElementById('app'));
  </script>
</body>
</html>
